name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Validate reviewed local media assets
        run: pnpm run media:check

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Build Cloudflare Worker
        run: pnpm run worker:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check all routes, box score and responsive states
        run: pnpm run visual:pro171 --compact

      - name: Check out original Standings baseline
        uses: actions/checkout@v4
        with:
          ref: b4dfd416d2d5d4a5eba7916afa55e2965554186e
          path: .standings-reference

      - name: Verify Standings A and capture visual evidence
        env:
          STANDINGS_BASELINE_ROOT: ${{ github.workspace }}/.standings-reference
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$STANDINGS_BASELINE_ROOT/node_modules"
          node scripts/issue66-standings-visual.mjs

      - name: Upload Standings visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: buzzerboard-standings-a
          path: |
            artifacts/issue-66/*.png
            artifacts/issue-66/measurements.json
            artifacts/issue-66/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Check out original Game Center baseline
        uses: actions/checkout@v4
        with:
          ref: 265013483423ccbcda87fccf9487476703431b77
          path: .pro223-reference/main

      - name: Check out Game Center before review fixes
        uses: actions/checkout@v4
        with:
          ref: a240237ce02caa50450079c7fdba082e596a09e5
          path: .pro223-reference/before

      - name: Capture full PRO-223 visual comparison
        env:
          PRO223_MAIN_ROOT: ${{ github.workspace }}/.pro223-reference/main
          PRO223_BEFORE_ROOT: ${{ github.workspace }}/.pro223-reference/before
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$PRO223_MAIN_ROOT/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$PRO223_BEFORE_ROOT/node_modules"
          node scripts/pro223-visual.mjs

      - name: Upload complete PRO-223 synthetic visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buzzerboard-pro223-visual-full
          path: artifacts/pro-223/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload representative visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buzzerboard-visual-ci
          path: artifacts/pro-171/ci/
          if-no-files-found: warn
          retention-days: 3
